# Tiny local plumbing test for train_ivjoint.py (single consumer GPU).
# Not for real training: 32px crops (smallest the Wan VAE 8x stride + patch 2
# allows; 5x5 is below the compression floor), 5-frame bucket cap, and the
# 600M model trained FROM SCRATCH (load_from: null) — the 2B model's fp32
# AdamW states alone (~20 GB) do not fit in 16 GB VRAM regardless of input
# size. Verifies: dataset -> buckets -> VAE encode -> model -> loss ->
# checkpoint -> log_validation.
#
# Run: bash deploy/train_ivjoint.sh configs/sana_video_minecraft_local_test.yaml \
#          --data.data_dir="{minecraft: path/to/manifest.jsonl}"
task: t2v
data:
  data_dir:
    minecraft: tmp/sana_video_manifest.jsonl
  image_size: 32
  # Bucket cap: with 32px there is no reason to test tall volumes; 5 is the
  # smallest 4n+1 frame count (latent_temp 2).
  num_frames: 5
  load_text_feat: false
  load_vae_feat: false
  shuffle_dataset: false
# model config
model:
  model: SanaMSVideo_600M_P2_D28
  image_size: 32
  mixed_precision: bf16
  fp32_attention: true
  load_from: null
  multi_scale: false
  attn_type: LiteLAReLURope
  # 600M hidden size is 1152; head dim must divide it (2B uses 112 for 2240)
  linear_head_dim: 32
  ffn_type: GLUMBConvTemp
  t_kernel_size: 3
  mlp_acts:
    - silu
    - silu
    -
  mlp_ratio: 3
  use_pe: true
  pos_embed_type: wan_rope
  qk_norm: true
  cross_norm: true
  class_dropout_prob: 0.1
# VAE setting
vae:
  vae_type: WanVAE
  vae_pretrained: hf://Efficient-Large-Model/SANA-Video_2B_480p/vae/Wan2.1_VAE.pth
  weight_dtype: float32
  vae_latent_dim: 16
  vae_downsample_rate: 8
  vae_stride:
    - 4
    - 8
    - 8
  if_cache: false
# text encoder
text_encoder:
  text_encoder_name: gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  chi_prompt: []
# Sana schedule Flow
scheduler:
  predict_flow_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  flow_shift: 3.0
  inference_flow_shift: 8.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver
# training setting
train:
  use_fsdp: false
  num_workers: 2
  seed: 1
  train_batch_size: 2
  num_epochs: 1
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 0.1
  # CAME8bit instead of AdamW: fp32 Adam states + gemma don't fit in 16 GB;
  # factored second moment + int8 exp_avg leave headroom for the
  # visualization/validation path on the same GPU.
  optimizer:
    betas:
      - 0.9
      - 0.999
      - 0.9999
    eps:
      - 1.0e-30
      - 1.0e-16
    lr: 5.0e-5
    type: CAME8BitWrapper
    weight_decay: 0.0
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 10
  auto_lr:
    rule: sqrt
  local_save_vis: true
  visualize: true
  deterministic_validation: true
  eval_sampling_steps: 50
  log_interval: 1
  save_model_epochs: 1
  save_model_steps: 50
  work_dir: tmp/sana_video_ivjoint_local_test
  online_metric: false
  joint_training_interval: 0
  validation_prompts:
    - '[Region]: A large island covered in dense green forests with sandy beaches along its shores, surrounded by deep blue water.'
work_dir: tmp/sana_video_ivjoint_local_test
report_to: tensorboard
tracker_project_name: minecraft-sana-video
name: ivjoint-local-test
